  })), { fmt: v => fmt.pct(v, 0), max: 1.2, ref: 1, refLabel: 'Target', labelW: 230, aria: 'Modeled FY27 attainment by plan' }));
}

/* ================= Revenue intelligence ================= */
function revClaim(M, f) {
  if (!M.n) return 'No accounts match these filters.';
  const lab = scopeLabel(f);
  return `${lab ? lab + ': ' : ''}${fmt.pct(M.attach)} of ${fmt.int(M.n)} firewall accounts run Prisma Access. Half of the remaining ${fmt.money(M.evTotal)} in whitespace sits in ${fmt.int(M.halfK)} accounts.`;
}

function revLede(M, sc) {
  const unc = sc.accs.filter(a => !a.cov), cov = sc.accs.filter(a => a.cov);
  const at = arr => mean(arr.map(a => a.pa)), md = arr => mean(arr.map(a => a.prop));
  let t;
  if (unc.length >= 30 && cov.length >= 30) t = `Accounts with a SASE specialist attach at ${fmt.pct(at(cov))}; accounts without one attach at ${fmt.pct(at(unc))}, against a modeled ${fmt.pct(md(unc))}.`;
  else if (unc.length >= 30) t = `No SASE specialist covers most of these accounts. They attach at ${fmt.pct(at(unc))}, against a modeled ${fmt.pct(md(unc))}.`;
  else t = `A SASE specialist covers these accounts, and attach runs ${fmt.pct(at(cov))} against a modeled ${fmt.pct(md(cov))}.`;
  const q2 = M.cov[1];
  if (M.pacing != null) t += ` Q1 bookings are at ${fmt.pct(M.pacing, 0)} of straight-line plan, and next quarter's pipeline covers ${fmt.x(q2.cov)} of its plan.`;
  return t;
}

function revKpis(M) {
  const q2 = M.cov[1];
  return [
    kpi('attach', 'SASE attach', fmt.pct(M.attach), M.attach, `${fmt.int(M.cust)} of ${fmt.int(M.n)} accounts`),
    kpi('arr', 'SASE ARR', fmt.money(M.arr), M.arr, 'Access, SD-WAN, and Browser'),
    kpi('qtd', 'Q1 bookings to date', fmt.money(M.qtd), M.qtd, M.pacing == null ? 'No plan in this scope' : `${fmt.pct(M.pacing, 0)} of straight-line plan`),
    kpi('q2cov', 'Q2 pipeline coverage', fmt.x(q2.cov), q2.cov, `${fmt.money(q2.pipe)} against ${fmt.money(q2.rem)} of plan`),
    kpi('winrate', 'Land win rate, FY26', fmt.pct(M.wr), M.wr, `${fmt.int(M.wrN)} closed first-purchase deals`),
    kpi('cycle', 'Median sales cycle', M.cyc == null ? '–' : `${Math.round(M.cyc)} days`, M.cyc, 'Won land deals, FY26'),
  ].join('');
}

function viewRevenue(root, focusId) {
  const f = S.f, sc = scope(f), M = metrics(sc);
  const opts = arr => [[-1, 'All'], ...arr.map((x, i) => [i, x])];
  const filtered = f.rg >= 0 || f.sg >= 0 || f.in >= 0;
  root.innerHTML = `
  <div class="filters" role="group" aria-label="Filters">
    ${selectHtml('f-rg', 'Region', opts(LK.regions), f.rg)}
    ${selectHtml('f-sg', 'Segment', opts(LK.segments), f.sg)}
    ${selectHtml('f-in', 'Industry', opts(LK.industries), f.in)}
    ${filtered ? '<button class="btn ghost" id="f-reset" type="button">Clear filters</button>' : ''}
  </div>
  <header class="claim"><h1 id="rev-claim">${esc(revClaim(M, f))}</h1>${M.n ? `<p class="lede">${esc(revLede(M, sc))}</p>` : ''}</header>
  ${M.n ? `<div class="kpis k6">${revKpis(M)}</div>
  <div class="tabs" role="tablist" aria-label="Revenue views">${REV_TABS.map(([id, name]) =>
    `<button class="tab" role="tab" id="tab-${id}" aria-selected="${S.revTab === id}" aria-controls="rev-body" data-tab="${id}" type="button">${name}</button>`).join('')}</div>
  <div id="rev-body" role="tabpanel"></div>` : '<p class="empty">Clear a filter to see results.</p>'}
  ${footer()}`;

  ['rg', 'sg', 'in'].forEach(k => $('#f-' + k, root).addEventListener('change', e => {
    S.f[k] = parseInt(e.target.value, 10);
    viewRevenue(root, 'f-' + k);
  }));
  const reset = $('#f-reset', root);
  if (reset) reset.addEventListener('click', () => { S.f = { rg: -1, sg: -1, in: -1 }; viewRevenue(root, 'f-rg'); });
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
  if (!M.n) return;
  $$('.tab', root).forEach(b => b.addEventListener('click', () => {
    S.revTab = b.dataset.tab;
    history.replaceState(null, '', '#revenue/' + S.revTab);
    $$('.tab', root).forEach(t => t.setAttribute('aria-selected', String(t === b)));
    renderRevTab(sc, M);
  }));
  renderRevTab(sc, M);
}

function renderRevTab(sc, M) {
  const body = $('#rev-body');
  if (!body) return;
  const fn = { pipeline: revPipeline, whitespace: revWhitespace, winloss: revWinLoss, trends: revTrends }[S.revTab] || revPipeline;
  fn(body, sc, M);
}

/* ---------- Pipeline health ---------- */
function revPipeline(body, sc, M) {
  const byStage = LK.stages.slice(0, 5).map((st, i) => {
    const os = M.open.filter(o => o.s === i);
    return { label: st, value: sum(os, o => o.m), n: os.length };
  });
  const weeks = [];
  for (let k = 25; k >= 0; k--) { const end = AS_OF - 7 * k; weeks.push({ end, v: createdInWeek(M.core, end) }); }
  const trail = weeks.map(w => { const prior = []; for (let j = 1; j <= 8; j++) prior.push(createdInWeek(M.core, w.end - 7 * j)); return mean(prior); });
  const stalled = [...M.stalled].sort((a, b) => b.m - a.m);
  const q2 = M.cov[1], need2x = Math.max(0, 2 * q2.rem - q2.pipe);
  const actions = [];
  if (stalled.length) actions.push(`Walk the ${stalled.length} stalled proof-of-value deals (${fmt.money(sum(stalled, o => o.m))}) in Tuesday's forecast call. The five largest get a packaged 30-day POV plan and a named SE.`);
  if (need2x > 0) actions.push(`Q2 needs about ${fmt.money(need2x)} more pipeline to reach 2x coverage. At ${fmt.money(M.weekly)} a week today, that means a creation sprint through mid-November, weighted to mid-market deals short enough to close inside the quarter.`);
  if (M.pastDue) actions.push(`Clear ${M.pastDue} past-due close dates before the forecast snapshot so the Q1 call reflects reality.`);

  body.innerHTML = `
  <div class="grid g2">
    ${panel('rp-stage', 'Open pipeline by stage', 'Land and expansion deals, all close dates')}
    ${panel('rp-cov', 'Coverage by quarter', 'Open pipeline closing in the quarter divided by plan still to book. Read the current and next quarter first; later quarters fill in as sellers create deals.')}
  </div>
  <div class="grid">${panel('rp-weekly', 'Pipeline created per week', 'Last 26 weeks, ending Fridays. The line is the trailing 8-week average, the baseline the weekly review flags against.')}</div>
  <div class="grid"><section class="panel"><h3>Stalled in Technical Validation</h3>
    <p class="cap">${stalled.length} open deals past the 45-day proof-of-value service level, worth ${fmt.money(sum(stalled, o => o.m))}. Largest ten shown.</p>
    ${stalled.length ? table([
      { h: 'Account', f: o => acctCell(o.acc) },
      { h: 'Amount', num: true, f: o => fmt.money(o.m) },
      { h: 'Days in stage', num: true, f: o => fmt.int(AS_OF - o.e) },
      { h: 'Competitor', f: o => esc(LK.competitors[o.k]) },
      { h: 'Pushes', num: true, f: o => String(o.u) },
      { h: 'Close date', f: o => esc(fmtDate(o.l)) },
    ], stalled.slice(0, 10)) : '<p class="empty">No stalled deals in this scope.</p>'}
  </section></div>
  ${actions.length ? `<aside class="action"><h3>What I would do</h3><ul>${actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></aside>` : ''}`;

  chart('rp-stage', el => Charts.hbar(el, byStage.map((r, i) => ({ ...r, color: STAGE_COLORS[i], tip: `${r.label}\n${fmt.money(r.value)} in ${r.n} deals` })),
    { fmt: v => fmt.money(v), labelW: 170, aria: 'Open pipeline by stage' }));
  chart('rp-cov', el => Charts.vbar(el, ['Rest of Q1', 'Q2', 'Q3', 'Q4'], [{
    name: 'Coverage',
    values: M.cov.map(c => c.cov ?? 0),
    labels: M.cov.map(c => (c.cov == null ? 'Plan met' : fmt.x(c.cov))),
    colors: M.cov.map((c, i) => (i > 1 ? PAL.slateSoft : c.cov == null || c.cov >= 2 ? PAL.moss : c.cov >= 1 ? PAL.amber : PAL.crimson)),
    tips: M.cov.map((c, i) => `FY27 Q${i + 1}\n${fmt.money(c.pipe)} of pipeline against ${fmt.money(Math.max(0, c.rem))} still to book\nCoverage ${c.cov == null ? 'n/a' : fmt.x(c.cov)}`),
  }], { fmt: v => fmt.x(v, 1), refs: [{ value: 2, label: '2x' }], valueLabels: v => fmt.x(v), h: 250, aria: 'Pipeline coverage by quarter' }));
  chart('rp-weekly', el => Charts.vbar(el, weeks.map(w => fmtDate(w.end, false)), [{
    name: 'Created', values: weeks.map(w => w.v), color: PAL.ultraMid,
    tips: weeks.map((w, i) => `Week ending ${fmtDate(w.end, false)}\nCreated ${fmt.money(w.v)}\n8-week average ${fmt.money(trail[i])}`),
  }], { fmt: v => fmt.money(v), labelEvery: 4, lines: [{ values: trail, color: PAL.ink, width: 1.8 }], h: 240, aria: 'Pipeline created per week' }));
}

/* ---------- Attach and whitespace ---------- */
function revWhitespace(body, sc, M) {
  const f = S.f;
  const accR = ACC.filter(a => f.rg < 0 || a.rg === f.rg);
  const cells = LK.industries.map((ind, ii) => LK.segments.map((sg, si) => {
    const as = accR.filter(a => a.in === ii && a.sg === si), c = as.filter(a => a.pa).length;
    const v = as.length ? c / as.length : 0;
    return { v, n: as.length, tip: `${ind}, ${sg}\nAttach ${fmt.pct(v)} (${c} of ${as.length})` };
  }));
  const byT = new Map();
  for (const a of ACC) { if (!byT.has(a.tr)) byT.set(a.tr, []); byT.get(a.tr).push(a); }
  const pts = TERR.map((t, ti) => {
    if ((f.rg >= 0 && t.rg !== f.rg) || (f.sg >= 0 && t.sg !== f.sg)) return null;
    const as = byT.get(ti) || [];
    if (as.length < 8) return null;
    const act = mean(as.map(a => a.pa)), mod = mean(as.map(a => a.prop));
    return { x: mod, y: act, r: 3 + Math.sqrt(as.length) * 0.55, color: t.cv ? PAL.ultra : PAL.crimson,
      tip: `${t.id}\n${as.length} accounts, ${t.cv ? 'SASE specialist' : 'no SASE specialist'}\nActual ${fmt.pct(act)}, modeled ${fmt.pct(mod)}` };
  }).filter(Boolean);
  const axMax = Math.min(1, Math.ceil(Math.max(0.05, ...pts.map(p => Math.max(p.x, p.y))) * 1.08 * 10) / 10);
  const non = sc.accs.filter(a => !a.pa);
  const playRows = LK.plays.map((pl, i) => ({ label: pl, value: sum(non.filter(a => a.pl === i), a => a.ev), n: non.filter(a => a.pl === i).length }))
    .filter(r => r.n > 0).sort((a, b) => b.value - a.value);
  const top = [...non].sort((a, b) => b.ev - a.ev);
  const top100 = top.slice(0, 100);
  const nRenew = top100.filter(a => a.rn >= 90 && a.rn <= 270).length;
  const nSSE = top100.filter(a => a.ic >= 2).length;
  const latent = Math.round(sum(sc.accs.filter(a => !a.cov), a => a.prop - a.pa));
  const lift = D.model.lift;
  const actions = [
    `Start with the ${fmt.int(M.halfK)} accounts that hold half the whitespace. ${nRenew} of the top 100 renew their firewall in 90 to 270 days, so they get the renewal-timed play first.`,
    `${nSSE} of the top 100 run a competitor's SSE today. Lead those with the SD-WAN bundle, where the win-rate lift is largest.`,
  ];
  if (latent > 5) actions.push(`About ${latent} customers are missing in uncovered territories in this scope. That is the case for specialist coverage, sized in the planning simulator.`);

  body.innerHTML = `
  <div class="grid g2">
    ${panel('rw-heat', 'Attach rate by industry and segment', `Share of firewall accounts running Prisma Access${f.rg >= 0 ? ', ' + LK.regions[f.rg] + ' only' : ''}. The region filter applies here; segment and industry filters do not.`)}
    ${panel('rw-scatter', 'Modeled versus actual attach, by territory', 'Each dot is a core territory, sized by accounts (territories under 8 accounts hidden). Dots below the line have fewer customers than the model expects.',
      legend([{ label: 'SASE specialist', color: PAL.ultra }, { label: 'No SASE specialist', color: PAL.crimson }]))}
  </div>
  <div class="grid g2">
    ${panel('rw-play', 'Propensity-weighted whitespace by play', `${fmt.money(M.evTotal)} across ${fmt.int(non.length)} non-customers in scope`)}
    ${panel('rw-lift', 'Model check: attach by propensity decile', `Out-of-fold predictions on covered accounts. The top decile attaches at ${D.model.topDecileLift}x the average; cross-validated AUC ${D.model.auc.toFixed(2)}.`)}
  </div>
  <div class="grid"><section class="panel"><h3>Top whitespace accounts</h3>
    <p class="cap">Ranked by expected value: propensity times first-year land potential. Plays come from incumbent, renewal timing, and footprint.</p>
    ${top.length ? table([
      { h: 'Account', f: a => `${esc(a.nm)}<span class="sub">${esc(LK.industries[a.in])}</span>` },
      { h: 'Segment', f: a => esc(LK.segments[a.sg]) },
      { h: 'Region', f: a => esc(LK.regions[a.rg]) },
      { h: 'Propensity', num: true, f: a => fmt.pct(a.prop, 0) },
      { h: 'Land potential', num: true, f: a => fmt.money(a.lp) },
      { h: 'Expected value', num: true, f: a => fmt.money(a.ev) },
      { h: 'Firewall renewal', f: a => esc(renewText(a.rn)) },
      { h: 'Play', f: a => esc(LK.plays[a.pl] || '') },
    ], top.slice(0, 15)) : '<p class="empty">Every account in this scope already runs Prisma Access.</p>'}
  </section></div>
  <aside class="action"><h3>What I would do</h3><ul>${actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></aside>`;

  chart('rw-heat', el => Charts.heat(el, LK.industries, SEG_SHORT, cells, { fmt: v => fmt.pct(v, 0), domain: [0, 0.6], aria: 'Attach rate by industry and segment' }));
  chart('rw-scatter', el => Charts.scatter(el, pts, { xMax: axMax, yMax: axMax, xFmt: v => fmt.pct(v, 0), yFmt: v => fmt.pct(v, 0), diagonal: true, xLabel: 'Modeled attach', yLabel: 'Actual attach', h: 320, aria: 'Modeled versus actual attach by territory' }));
  chart('rw-play', el => Charts.hbar(el, playRows.map(r => ({ ...r, color: PAL.ultra, tip: `${r.label}\n${fmt.money(r.value)} across ${r.n} accounts` })), { fmt: v => fmt.money(v), labelW: 180, aria: 'Whitespace by play' }));
  chart('rw-lift', el => Charts.vbar(el, lift.map(l => String(l.decile)), [{
    name: 'Attach', values: lift.map(l => l.attach_rate), colors: lift.map((l, i) => (i < 3 ? PAL.ultra : PAL.ultraSoft)),
    tips: lift.map(l => `Decile ${l.decile}\nAttach ${fmt.pct(l.attach_rate)} (${l.adopters} of ${l.accounts})\nCumulative capture ${fmt.pct(l.cum_capture, 0)}`),
  }], { fmt: v => fmt.pct(v, 0), refs: [{ value: D.model.trainRate, label: 'Average' }], h: 250, aria: 'Attach by propensity decile' }));
}

/* ---------- Win and loss ---------- */
function revWinLoss(body, sc, M) {
  const land = M.landClosed;
  if (!land.length) { body.innerHTML = '<p class="empty">No closed land deals in this scope.</p>'; return; }
  const comps = LK.competitors.map((c, ci) => {
    const d = land.filter(o => o.k === ci);
    return { c: c === 'No competitor' ? 'None' : c, nb: d.filter(o => !o.b), wb: d.filter(o => o.b) };
  });
  const lost = land.filter(o => o.lost);
  const stageRows = [1, 2, 3, 4].map(si => { const n = lost.filter(o => o.x === si).length; return { label: LK.stages[si], value: lost.length ? n / lost.length : 0, n }; });
  const reasonRows = LK.lossReasons.map((r, ri) => { const n = lost.filter(o => o.r === ri).length; return { label: r, value: lost.length ? n / lost.length : 0, n }; })
    .filter(r => r.n > 0).sort((a, b) => b.value - a.value);
  const sse = land.filter(o => o.k === 0 || o.k === 1);
  const mmcom = land.filter(o => o.acc.sg >= 2);
  const factors = [
    ['SD-WAN in the deal, against Zscaler or Netskope', sse.filter(o => o.b), sse.filter(o => !o.b)],
    ['Opened 90 to 270 days before the firewall renewal', land.filter(o => o.n), land.filter(o => !o.n)],
    ['A SASE specialist covers the territory', land.filter(o => o.acc.cov), land.filter(o => !o.acc.cov)],
    ['Partner-sourced, mid-market and commercial', mmcom.filter(o => o.o === 2), mmcom.filter(o => o.o !== 2)],
  ].map(([label, a, b]) => ({ label, w: rate(a), wo: rate(b), na: a.length, nb: b.length }));
  const sseLost = sse.filter(o => o.lost);
  const tvShare = sseLost.length ? sseLost.filter(o => o.x === 2).length / sseLost.length : null;
  const f0 = factors[0], f1 = factors[1];
  const actions = [];
  if (f0.w != null && f0.wo != null) actions.push(`Make SD-WAN part of every Zscaler and Netskope proposal. Bundled deals win ${fmt.pct(f0.w, 0)} against ${fmt.pct(f0.wo, 0)} here.`);
  if (tvShare != null) actions.push(`Put competitive POVs on a 30-day plan with written success criteria: ${fmt.pct(tvShare, 0)} of losses to SSE rivals happen in Technical Validation.`);
  if (f1.w != null && f1.wo != null) actions.push(`Start SASE conversations 90 to 270 days before the firewall renewal. Those deals win ${fmt.pct(f1.w, 0)} against ${fmt.pct(f1.wo, 0)}.`);

  body.innerHTML = `
  <div class="grid g2">
    ${panel('rl-comp', 'Win rate by competitor, with and without SD-WAN', `${fmt.int(land.length)} closed land deals since FY24 Q1. Competitor names are real so the analysis reads realistically; the win rates are synthetic.`,
      legend([{ label: 'Without SD-WAN', color: PAL.slateSoft }, { label: 'With SD-WAN', color: PAL.ultra }]))}
    ${panel('rl-stage', 'Where lost deals exit', `Share of ${fmt.int(lost.length)} lost land deals, by the stage they died in`)}
  </div>
  <div class="grid g2">
    ${panel('rl-reason', 'Loss reasons', 'Share of lost land deals')}
    <section class="panel"><h3>What moves win rate</h3><p class="cap">Raw rates in this scope. Across the whole book, the SD-WAN effect holds after controlling for coverage, segment, timing, and source.</p>
    ${table([
      { h: 'Factor', f: r => esc(r.label) },
      { h: 'With', num: true, f: r => fmt.pct(r.w, 0) },
      { h: 'Without', num: true, f: r => fmt.pct(r.wo, 0) },
      { h: 'Difference', num: true, f: r => (r.w == null || r.wo == null ? '–' : fmt.pts((r.w - r.wo) * 100, 0)) },
      { h: 'Deals', num: true, f: r => fmt.int(r.na + r.nb) },
    ], factors)}</section>
  </div>
  ${actions.length ? `<aside class="action"><h3>What I would do</h3><ul>${actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></aside>` : ''}`;

  chart('rl-comp', el => Charts.vbar(el, comps.map(c => c.c), [
    { name: 'Without SD-WAN', values: comps.map(c => rate(c.nb) ?? 0), color: PAL.slateSoft, tips: comps.map(c => `${c.c}, without SD-WAN\n${c.nb.length ? fmt.pct(rate(c.nb)) : 'no deals'} of ${c.nb.length} deals`) },
    { name: 'With SD-WAN', values: comps.map(c => rate(c.wb) ?? 0), color: PAL.ultra, tips: comps.map(c => `${c.c}, with SD-WAN\n${c.wb.length ? fmt.pct(rate(c.wb)) : 'no deals'} of ${c.wb.length} deals`) },
  ], { fmt: v => fmt.pct(v, 0), max: 1, h: 260, aria: 'Win rate by competitor and SD-WAN bundle' }));
  chart('rl-stage', el => Charts.hbar(el, stageRows.map(r => ({ ...r, color: r.label === 'Technical Validation' ? PAL.crimson : PAL.slate, tip: `${r.label}\n${fmt.pct(r.value)} of lost deals (${r.n})` })), { fmt: v => fmt.pct(v, 0), labelW: 170, aria: 'Loss stage' }));
  chart('rl-reason', el => Charts.hbar(el, reasonRows.map(r => ({ ...r, color: PAL.slate, tip: `${r.label}\n${fmt.pct(r.value)} of lost deals (${r.n})` })), { fmt: v => fmt.pct(v, 0), labelW: 190, aria: 'Loss reasons' }));
}

/* ---------- Trends ---------- */
function revTrends(body, sc, M) {
  const qs = [];
  for (let fy = 2024; fy <= 2027; fy++) for (let q = 1; q <= 4; q++) if (!(fy === 2027 && q > 1)) qs.push([fy, q]);
  const inQ = (o, fy, q) => o.fq.fy === fy && o.fq.q === q;
  const land = qs.map(([fy, q]) => sum(M.won.filter(o => o.t === 0 && inQ(o, fy, q)), o => o.m));
  const exp = qs.map(([fy, q]) => sum(M.won.filter(o => o.t === 1 && inQ(o, fy, q)), o => o.m));
  const labels = qs.map(([fy, q]) => `Q${q} FY${String(fy % 100).padStart(2, '0')}`);
  const attach = qs.map(([fy, q]) => {
    const end = Math.min(qBounds(fy, q)[1], AS_OF);
    return sc.accs.length ? sc.accs.filter(a => a.fd != null && a.fd <= end).length / sc.accs.length : 0;
  });
  const fy25 = sum(M.won.filter(o => o.fq.fy === 2025), o => o.m);
  const growth = fy25 > 0 ? M.fy26b / fy25 - 1 : null;
  const fy26exp = sum(M.won.filter(o => o.t === 1 && o.fq.fy === 2026), o => o.m);
  body.innerHTML = `

    legend([{ label: 'Land (first purchase)', color: PAL.ultra }, { label: 'Expansion', color: PAL.ultraSoft }]))}</div>

/* Planning simulator. The engine mirrors pipeline/planning.py line for line;
   tests/check_app.py asserts both return the same attainment. */
const SEAS_M = Array.from({ length: 12 }, (_, m) => D.cfg.seasonality[Math.floor(m / 3)] / 3);
const MONTH_LABELS = ['Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
const PI = D.planning.inputs;
const PLAYS_PTS = Math.round((D.planning.levers.bundle_pts + D.planning.levers.renewal_pts) * 10) / 10;
const planDefaults = () => ({
  growth: D.cfg.growth, prod: PI.productivity, ramp: D.cfg.rampMonths, attrition: D.cfg.attrition,
  lead: D.cfg.lead, hiresNow: 0, hiresQ2: 0, winDelta: 0, dealDelta: 0, partnerLift: 0,
});
S.plan = planDefaults();

function planRun(p) {
  const target = PI.fy26_bookings * (1 + p.growth);
  const winMult = (PI.win_rate + p.winDelta / 100) / PI.win_rate;
  const mult = winMult * (1 + p.dealDelta);
  const s = Math.pow(1 - p.attrition, 1 / 12);
  const surv = m => Math.pow(s, Math.max(0, m - 1));
  const ramp = t => (t < 0 ? 0 : Math.min(1, (t + 0.5) / p.ramp));
  const starts = PI.specialist_start_months, nEx = starts.length;
  const core = PI.core_baseline * (1 + (p.partnerLift || 0));
  const cohorts = [];
  if (p.hiresNow) cohorts.push([2 + p.lead, p.hiresNow]);
  if (p.hiresQ2) cohorts.push([3 + p.lead, p.hiresQ2]);
  const months = [];
  for (let m = 0; m < 12; m++) {
    let exist = 0;
    for (const st of starts) exist += ramp(m - st);
    exist *= surv(m);
    let back = 0;
    for (let k = 2; k < 12; k++) back += (surv(k - 1) - surv(k)) * ramp(m - (k + p.lead));
    back *= nEx;
    let nw = 0;
    for (const [st, n] of cohorts) nw += n * Math.pow(s, Math.max(0, m - st)) * ramp(m - st);
    const specCap = p.prod * SEAS_M[m] * (exist + back) * mult;
    const newCap = p.prod * SEAS_M[m] * nw * mult;
    const coreCap = core * SEAS_M[m] * mult;
    months.push({ m, fteExist: exist + back, fteNew: nw, cap: specCap + newCap + coreCap, capNew: newCap });
  }
  const act = PI.actual_by_month;
  let forecast = 0, newArr = 0;
  for (let m = 2; m < 12; m++) { forecast += months[m].cap; newArr += months[m].capNew; }
  const total = act[0] + act[1] + forecast;
  const newCost = sum(cohorts, ([st, n]) => (n * Math.max(0, 12 - st) * PI.specialist_cost) / 12);
  const runRate = sum(cohorts, ([, n]) => n) * p.prod * mult;
  return { target, total, att: total / target, gap: target - total, newArr, newCost, runRate, months, winMult };
}

function solveHires(p, cap = 60) {
  for (let h = 0; h <= cap; h++) if (planRun({ ...p, hiresNow: h }).att >= 1) return h;
  return null;
}

function planScenarios(base) {
  const lev = D.planning.levers;
  const b = { ...base, hiresNow: 0, hiresQ2: 0, winDelta: 0 };
  const withPlays = { ...b, winDelta: PLAYS_PTS };
  const recH = solveHires(withPlays), onlyH = solveHires(b);
  const defs = [
    ['Current plan', "Today's specialists, backfills for attrition, no new hires", b],
    ['Hire 6 specialists now', 'Approved this month, productive after lead time and ramp', { ...b, hiresNow: 6 }],
    ['Win-rate plays', `SD-WAN in rival deals (+${lev.bundle_pts} pts) and renewal timing (+${lev.renewal_pts} pts)`, withPlays],
    [`Recommended: plays + ${recH ?? '60+'} hires`, 'Smallest hiring plan that reaches 100% with both plays in place', { ...withPlays, hiresNow: recH ?? 60 }],
    ['Hiring only', 'Hires needed now if nothing else changes', { ...b, hiresNow: onlyH ?? 60 }],
  ];
  const baseTotal = planRun(b).total;
  return defs.map(([name, desc, p]) => { const r = planRun(p); return { name, desc, p, r, inc: r.total - baseTotal }; });
}

/* ---------- Territory designer ---------- */
const terrValue = a => (a.pa ? 0.2 * Math.max(0, a.fp - a.ar) : a.ev);
function balanceTerritories(accts, k) {
  const items = accts.map(a => ({ a, v: terrValue(a) })).sort((x, y) => y.v - x.v);
  const T = Array.from({ length: k }, (_, i) => ({ i, v: 0, n: 0, accts: [] }));
  const mv = sum(items, it => it.v) / k || 1, mn = items.length / k || 1;
  for (const it of items) {
    let best = T[0], bs = Infinity;
    for (const t of T) { const score = t.v / mv + (0.35 * t.n) / mn; if (score < bs) { bs = score; best = t; } }
    best.v += it.v; best.n += 1; best.accts.push(it.a);
  }
  return T.sort((a, b) => b.v - a.v).map((t, rank) => ({ ...t, i: rank }));
}
const cvOf = arr => { const m = mean(arr); return m ? stdev(arr) / m : 0; };

function renderTerritoryOut() {
  const T = S.terr;
  const accts = ACC.filter(a => a.rg === T.rg && a.sg === T.sg);
  const cap = D.cfg.accountsPerSpecialist[T.sg];
  const suggested = Math.max(1, Math.ceil(accts.length / cap));
  const k = clamp(T.k ?? suggested, 1, 20);
  $('#tr-k').value = k;
  $('#tr-k-out').textContent = String(k);
  const cur = new Map();
  for (const a of accts) {
    const t = cur.get(a.tr) || { id: TERR[a.tr].id, v: 0, n: 0, cv: TERR[a.tr].cv };
    t.v += terrValue(a); t.n += 1; cur.set(a.tr, t);
  }
  const curRows = [...cur.values()].sort((a, b) => b.v - a.v);
  const prop = balanceTerritories(accts, k);
  const specNow = SPEC.filter(s => s.rg === T.rg && s.sg === T.sg).length;
  const covShare = accts.length ? accts.filter(a => a.cov).length / accts.length : 0;
  const total = sum(accts, terrValue);
  const cvCur = cvOf(curRows.map(r => r.v)), cvNew = cvOf(prop.map(t => t.v));
  const topInd = t => {
    const cnt = new Map();
    for (const a of t.accts) cnt.set(a.in, (cnt.get(a.in) || 0) + 1);
    return [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(([i]) => LK.industries[i]).join(', ');
  };
  $('#tr-out').innerHTML = `
    <div class="kpis k4" style="margin-top:20px">
      ${kpi('tr-accts', 'Accounts', fmt.int(accts.length), accts.length, `${fmt.pct(covShare, 0)} covered by ${specNow} specialist${specNow === 1 ? '' : 's'} today`)}
      ${kpi('tr-value', 'Opportunity value', fmt.money(total), total, 'Whitespace plus 20% of expansion room')}
      ${kpi('tr-sugg', 'Suggested specialists', String(suggested), suggested, `One per about ${cap} ${LK.segments[T.sg].toLowerCase()} accounts`)}
      ${kpi('tr-cv', 'Load imbalance', `${fmt.pct(cvCur, 0)} to ${fmt.pct(cvNew, 1)}`, cvNew, 'Spread of territory value, today versus proposed')}
    </div>
    <div class="grid g2">
      ${panel('tr-cur', 'Today: core seller territories', `${curRows.length} territories. Red means no SASE specialist.`)}
      ${panel('tr-new', 'Proposed: balanced specialist territories', `${k} territories of roughly equal value`)}
    </div>
    <div class="grid"><section class="panel"><h3>Proposed territories</h3>
      ${table([
        { h: 'Territory', f: t => `Specialist territory ${t.i + 1}` },
        { h: 'Accounts', num: true, f: t => fmt.int(t.n) },
        { h: 'Customers', num: true, f: t => fmt.int(t.accts.filter(a => a.pa).length) },
        { h: 'Opportunity value', num: true, f: t => fmt.money(t.v) },
        { h: 'Largest account', f: t => { const a = [...t.accts].sort((x, y) => terrValue(y) - terrValue(x))[0]; return a ? `${esc(a.nm)}<span class="sub">${fmt.money(terrValue(a))}</span>` : '–'; } },
        { h: 'Main industries', f: t => esc(topInd(t)) },
      ], prop)}
    </section></div>`;
  chart('tr-cur', el => Charts.hbar(el, curRows.map(r => ({ label: r.id, value: r.v, color: r.cv ? PAL.ultra : PAL.crimson, tip: `${r.id}\n${r.n} accounts, ${fmt.money(r.v)}\n${r.cv ? 'SASE specialist' : 'No SASE specialist'}` })), { fmt: v => fmt.money(v), labelW: 110, rowH: 26, aria: 'Current territory loads' }));
  chart('tr-new', el => Charts.hbar(el, prop.map(t => ({ label: `Territory ${t.i + 1}`, value: t.v, color: PAL.ultra, tip: `Territory ${t.i + 1}\n${t.n} accounts, ${fmt.money(t.v)}` })), { fmt: v => fmt.money(v), labelW: 110, rowH: 26, ref: total / k, refLabel: 'Even split', aria: 'Proposed territory loads' }));
}

/* ================= Executive layer: the weekly business review drafts itself ================= */
function wbrWeeks() { const out = []; for (let d = Q1S + 6; d <= AS_OF; d += 7) out.push(d); return out; }

function buildWbr(weekEnd, rg) {
  const core = OPP.filter(o => o.core && (rg < 0 || o.acc.rg === rg));
  const ws = weekEnd - 6, [q2s, q2e] = qBounds(2027, 2);
  const fy26 = sum(core.filter(o => o.won && o.fq.fy === 2026), o => o.m);
  const target = fy26 * (1 + D.cfg.growth), q1Plan = target * D.cfg.seasonality[0], q2Plan = target * D.cfg.seasonality[1];
  const qtd = sum(core.filter(o => o.won && o.l >= Q1S && o.l <= weekEnd), o => o.m);
  const elapsed = (weekEnd - Q1S + 1) / (Q1E - Q1S + 1);
  const pacing = q1Plan > 0 ? qtd / (q1Plan * elapsed) : null;
  const inWeek = o => o.l >= ws && o.l <= weekEnd;
  const wins = core.filter(o => o.won && inWeek(o)).sort((a, b) => b.m - a.m);
  const losses = core.filter(o => o.lost && inWeek(o)).sort((a, b) => b.m - a.m);
  const created = k => createdInWeek(core, weekEnd - 7 * k);
  const cur = created(0), trail = [1, 2, 3, 4, 5, 6, 7, 8].map(created), avg = mean(trail), sd = stdev(trail);
  const z = sd > 0 ? (cur - avg) / sd : 0;
  const openAt = o => o.c <= weekEnd && (o.open || o.l > weekEnd);
  const q1Open = core.filter(o => openAt(o) && o.l >= Q1S && o.l <= Q1E);
  const q1Need = Math.max(0, q1Plan - qtd), q1Pipe = sum(q1Open, o => o.m);
  const q2Pipe = sum(core.filter(o => openAt(o) && o.l >= q2s && o.l <= q2e), o => o.m);
  const q2Cov = q2Plan > 0 ? q2Pipe / q2Plan : null;
  const slips = core.filter(o => o.q != null && o.q >= ws && o.q <= weekEnd);
  const repeat = slips.filter(o => o.u >= 2);
  const current = weekEnd === AS_OF;
  const risks = q1Open.filter(o => o.u >= 2 || (current && o.open && o.s === 2 && AS_OF - o.e > D.cfg.stageSla[2]))
    .sort((a, b) => b.m - a.m).slice(0, 3);
  const pastDue = current ? core.filter(o => o.open && o.l < AS_OF).length : 0;
  const weekNo = Math.floor((weekEnd - Q1S) / 7) + 1;

  const pace = pacing == null ? 'Q1 has no plan in this scope'
    : pacing >= 1.05 ? `Q1 is ahead of pace at ${fmt.pct(pacing, 0)} of plan`
    : pacing >= 0.95 ? `Q1 is on pace at ${fmt.pct(pacing, 0)} of plan`
    : `Q1 is behind pace at ${fmt.pct(pacing, 0)} of plan`;
  let risk = '';
  if (q2Cov != null && q2Cov < 1) risk = `Q2 pipeline covers only ${fmt.x(q2Cov)} of plan`;
  else if (z < -1.5) risk = 'pipeline creation fell well below trend';
  else if (repeat.length >= 3) risk = `${repeat.length} deals slipped for the second time or more`;
  const good = pacing != null && pacing >= 0.95;
  const headline = `${pace}${risk ? (good ? ', but ' : ', and ') + risk : ''}.`;

  const asks = [];
  if (q2Cov != null && q2Cov < 1.5) asks.push(`Marketing and Partners: a Q2 pipeline sprint. Q2 needs about ${fmt.money(Math.max(0, 1.5 * q2Plan - q2Pipe))} more pipeline to reach 1.5x coverage; prioritize mid-market and commercial deals that can close inside the quarter.`);
  if (z < -1.5) asks.push(`Regional sales leaders: explain the drop in pipeline creation, ${fmt.money(avg - cur)} below the 8-week average, by Monday. Seasonality, event timing, or a real slowdown?`);
  if (pacing != null && pacing < 0.95) asks.push(`Regional VPs: name two or three Q1 deals to pull forward. Q1 still needs ${fmt.money(q1Need)}, with ${fmt.x(q1Need > 0 ? q1Pipe / q1Need : null)} coverage.`);
  if (repeat.length) asks.push(`Deal owners: updated close plans for the ${repeat.length} repeat slippers (${fmt.money(sum(repeat, o => o.m))}) before Tuesday's forecast call.`);
  if (pastDue) asks.push(`Sales Ops: clear ${pastDue} past-due close dates before the forecast snapshot.`);
  return { weekEnd, weekNo, headline, qtd, q1Plan, pacing, q1Need, q1Pipe, q1Cov: q1Need > 0 ? q1Pipe / q1Need : null,
    q2Pipe, q2Plan, q2Cov, cur, avg, z, wins, losses, slips, repeat, risks, pastDue, asks, current,
    weekBookings: sum(wins, o => o.m) };
}

function wbrContent(w, rg) {
  const subj = `SASE WBR${rg < 0 ? '' : ' (' + LK.regions[rg] + ')'}, week ${w.weekNo} of FY27 Q1: ${w.headline}`;
  const deal = o => `${o.acc.nm} (${LK.segments[o.acc.sg]}, ${LK.regions[o.acc.rg]}), ${fmt.money(o.m)}, ${LK.products[o.p]}`;
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const sections = [
    ['Numbers', [
      `Bookings this week: ${fmt.money(w.weekBookings)} across ${plural(w.wins.length, 'deal')}. Quarter to date: ${fmt.money(w.qtd)}, ${w.pacing == null ? 'no plan in scope' : fmt.pct(w.pacing, 0) + ' of straight-line plan'} (Q1 plan ${fmt.money(w.q1Plan)}).`,
      `Pipeline created this week: ${fmt.money(w.cur)}, against an 8-week average of ${fmt.money(w.avg)} (${w.z >= 0 ? '+' : '−'}${Math.abs(w.z).toFixed(1)} standard deviations).`,
      `Coverage: the rest of Q1 at ${w.q1Cov == null ? 'plan already met' : fmt.x(w.q1Cov)} of what is still needed; Q2 at ${fmt.x(w.q2Cov)} of plan.`,
    ]],
    ['What moved', [
      ...w.wins.slice(0, 3).map(o => `Won: ${deal(o)}.`),
      ...w.losses.slice(0, 2).map(o => `Lost${o.k < 5 ? ' to ' + LK.competitors[o.k] : ''}: ${deal(o)}. Reason: ${(LK.lossReasons[o.r] || 'not recorded').toLowerCase()}.`),
      `Slipped: ${plural(w.slips.length, 'deal')} (${fmt.money(sum(w.slips, o => o.m))})${w.repeat.length ? `, ${w.repeat.length} of them for the second time or more` : ''}.`,
    ]],
    ['Risks', w.risks.length
      ? w.risks.map(o => `${o.acc.nm}: ${fmt.money(o.m)}, closing ${fmtDate(o.l, false)}, pushed ${plural(o.u, 'time')}${w.current && o.open ? `, in ${LK.stages[o.s]} for ${AS_OF - o.e} days` : ''}.`)
      : ['No flagged deals closing this quarter.']],
    ['Asks', w.asks.length ? w.asks : ['None this week.']],
  ];
  if (w.current) sections.push(['Hygiene', [`${plural(w.pastDue, 'open deal')} ${w.pastDue === 1 ? 'has' : 'have'} a past-due close date.`]]);
  const html = `<p class="subject">${esc(subj)}</p>` + sections.map(([h, items]) => `<h4>${esc(h)}</h4><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`).join('');
  const text = `Subject: ${subj}\n\n` + sections.map(([h, items]) => `${h}\n${items.map(i => `- ${i}`).join('\n')}`).join('\n\n') + '\n';
  return { html, text };
}

function memoHtml(m) {
  return `<article class="memo"><h3 class="memo-title">${esc(m.subject)}</h3>
    <dl class="memo-meta"><dt>To</dt><dd>${esc(m.to)}</dd><dt>From</dt><dd>${esc(m.from)}</dd><dt>Date</dt><dd>${esc(m.date)}</dd></dl>
    <div class="bl"><strong>Bottom line.</strong> ${esc(m.bottom_line)}</div>
    ${m.sections.map(sec => `<h4>${esc(sec.title)}</h4>${sec.paragraph ? `<p>${esc(sec.paragraph)}</p>` : ''}${sec.bullets ? `<ul>${sec.bullets.map(([l, t]) => `<li><strong>${esc(l)}</strong> ${esc(t)}</li>`).join('')}</ul>` : ''}`).join('')}
    <p class="method">${esc(m.method)}</p></article>`;
}

function viewExec(root) {
  const weeks = wbrWeeks();
  if (!weeks.includes(S.wbr.week)) S.wbr.week = weeks[weeks.length - 1];
  root.innerHTML = `
  <header class="claim"><h1 id="wbr-claim"></h1>
    <p class="lede">Every Friday, the weekly business review drafts itself from the pipeline: what moved, what is at risk, and what I need from whom. An analyst edits the draft; it never replaces judgment.</p></header>
  <div class="filters">
    ${selectHtml('wbr-week', 'Week ending', weeks.map(d => [d, `Week ${Math.floor((d - Q1S) / 7) + 1}, ${fmtDate(d, false)}`]), S.wbr.week)}
    ${selectHtml('wbr-rg', 'Region', [[-1, 'All regions'], ...LK.regions.map((r, i) => [i, r])], S.wbr.rg)}
  </div>
  <div class="wbr-grid">
    <article class="panel wbr" id="wbr" aria-live="polite"></article>
    <aside class="panel side">
      <h3>This week at a glance</h3>
      <div id="wbr-side"></div>
      <div class="ctl-actions"><button class="btn primary" id="wbr-copy" type="button">Copy as text</button><span id="wbr-copied" class="muted" role="status" style="align-self:center"></span></div>
      <p class="cap" style="margin-top:12px">Earlier weeks are rebuilt from today's records, so a deal that slipped later shows its current close date.</p>
    </aside>
  </div>
  <section class="block"><h2>The one-page memo</h2>
    <p class="serif narrow">The flagship readout for a VP: the answer first, the evidence second, the asks third. Every number comes from the same data as this app. <a href="docs/executive_memo.pdf">Download the PDF</a>.</p>
    ${memoHtml(D.memo)}
  </section>
  ${footer()}`;
  $('#wbr-week').addEventListener('change', e => { S.wbr.week = parseInt(e.target.value, 10); renderWbr(); });
  $('#wbr-rg').addEventListener('change', e => { S.wbr.rg = parseInt(e.target.value, 10); renderWbr(); });
  $('#wbr-copy').addEventListener('click', () => {
    const text = $('#wbr').dataset.text || '';
    const done = ok => { $('#wbr-copied').textContent = ok ? 'Copied' : 'Select the text to copy'; };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove(); done(ok);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done(true), fallback);
    else fallback();
  });
  renderWbr();
}

function renderWbr() {
  const w = buildWbr(S.wbr.week, S.wbr.rg), out = wbrContent(w, S.wbr.rg);
  $('#wbr-claim').textContent = `Week ${w.weekNo}: ${w.headline}`;
  const box = $('#wbr');
  box.innerHTML = out.html;
  box.dataset.text = out.text;
  $('#wbr-copied').textContent = '';
  $('#wbr-side').innerHTML = `<dl class="dl">
    <div><dt>Bookings this week</dt><dd>${fmt.money(w.weekBookings)}</dd></div>
    <div><dt>Quarter to date</dt><dd>${fmt.money(w.qtd)}</dd></div>
    <div><dt>Pacing to plan</dt><dd>${fmt.pct(w.pacing, 0)}</dd></div>
    <div><dt>Pipeline created</dt><dd>${fmt.money(w.cur)} <span class="muted">(${w.z >= 0 ? '+' : '−'}${Math.abs(w.z).toFixed(1)} SD)</span></dd></div>
    <div><dt>Q2 coverage</dt><dd>${fmt.x(w.q2Cov)}</dd></div>
    <div><dt>Deals slipped</dt><dd>${w.slips.length}</dd></div>
  </dl>`;
}

  render();
}

/* Smallest axis maximum whose four tick steps land on round numbers. */
function roundAxisMax(v, headroom = 1.08) {
  const target = Math.max(v * headroom, 1e-9) / 4;
  const e = Math.pow(10, Math.floor(Math.log10(target)));
  const step = [1, 1.5, 2, 2.5, 5, 10].map(k => k * e).find(s => s >= target);
  return step * 4;
}

/* Time-scaled line chart: each series has its own dates. points: [{t: day index, v, label}] */
Charts.timeLine = function (el, series, o = {}) {
  const W = widthOf(el), H = o.h || 260, m = { t: 16, r: o.endLabels ? 96 : 18, b: 30, l: o.yW || 58 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b, f = o.fmt || String;
  const pts = series.flatMap(s => s.points);
  if (!pts.length) { el.innerHTML = '<p class="empty">No data yet.</p>'; return; }
  let t0 = Math.min(...pts.map(p => p.t)), t1 = Math.max(...pts.map(p => p.t));
  const pad = Math.max(20, (t1 - t0) * 0.05);
  t0 -= pad; t1 += pad;
  const x = t => m.l + ((t - t0) / (t1 - t0)) * pw;
  const max = o.max || roundAxisMax(Math.max(...pts.map(p => p.v)), 1.05);
  const y = v => m.t + ph - (clamp(v, 0, max) / max) * ph;
  let s = '';
  for (const tv of tickVals(max, 4)) {
    s += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y(tv).toFixed(1)}" y2="${y(tv).toFixed(1)}"/>`;
    s += `<text class="tick" x="${m.l - 8}" y="${y(tv).toFixed(1)}" dy=".32em" text-anchor="end">${esc(f(tv))}</text>`;
  }
  for (let yr = toDate(t0).getUTCFullYear(); yr <= toDate(t1).getUTCFullYear(); yr++) {
    for (const mo of [1, 7]) {
      const t = toDay(yr, mo, 1);
      if (t < t0 || t > t1) continue;
      const lx = x(t).toFixed(1);
      s += `<line class="gl" x1="${lx}" x2="${lx}" y1="${m.t}" y2="${m.t + ph}" stroke-dasharray="2 3"/>`;
      if (mo === 1 || pw > 520) s += `<text class="tick" x="${lx}" y="${H - 9}" text-anchor="middle">${mo === 1 ? yr : 'Jul'}</text>`;
    }
  }
  for (const se of series) {
    const p = [...se.points].sort((a, b) => a.t - b.t);
    if (!p.length) continue;
    if (p.length > 1) s += `<path d="${p.map((q, i) => `${i ? 'L' : 'M'}${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join('')}" fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" pointer-events="none"/>`;
    for (const q of p) s += `<circle cx="${x(q.t).toFixed(1)}" cy="${y(q.v).toFixed(1)}" r="${p.length > 1 ? 3.5 : 5.5}" fill="${se.color}" stroke="#fff" stroke-width="1.2"${tipA(`${se.name}\n${q.label}: ${f(q.v)}`)}/>`;
  }
  if (o.endLabels) {
    const labels = series.filter(se => se.points.length).map(se => {
      const last = [...se.points].sort((a, b) => a.t - b.t).pop();
      return { text: se.short || se.name, x: x(last.t) + 9, y: y(last.v) };
    }).sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
    for (const l of labels) s += `<text class="val" x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" dy=".35em">${esc(l.text)}</text>`;
  }
  el.innerHTML = svgDoc(W, H, s, o.aria);
};

const SERIES_STYLE = {
  'Palo Alto Networks SASE ARR': { color: PAL.ultra, short: 'Palo Alto' },
  'Zscaler ARR': { color: PAL.ink, short: 'Zscaler' },
  'Fortinet Unified SASE ARR': { color: PAL.slate, short: 'Fortinet' },
  'Netskope ARR': { color: PAL.ultraMid, short: 'Netskope' },
};
const fmtStamp = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? String(s) : `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
const precisionWord = p => (p === 'approx' ? 'about ' : p === 'floor' ? 'over ' : '');

function pendingPanel(title, entry) {
  const invalid = String(entry.status).startsWith('invalid');
  return `<section class="panel"><h3>${esc(title)}</h3>
    <p class="cap">${invalid ? `Found ${esc(entry.file)} but it failed the schema check: ${esc(String(entry.status).replace(/^invalid:\s*/, ''))}.` : `Waiting for ${esc(entry.file)}.`}</p>
    <p class="empty">Run <code>python pipeline/fetch_public_data.py</code> (built by cto from docs/cto_brief.md), then <code>python pipeline/run_all.py</code>.</p></section>`;
}

function viewMarket(root) {
  const M = D.market;

  }
  const cu = M.curated, pub = M.public;
  const companies = cu.growth.filter(g => g.kind === 'company').sort((a, b) => b.growth - a.growth);
  const panw = companies.find(g => g.ticker === 'PANW');
  const mkt = cu.growth.find(g => g.kind === 'market');
  const ratio = panw && mkt && mkt.growth ? panw.growth / mkt.growth : null;
  const pace = ratio == null ? '' : ratio >= 1.75 && ratio <= 2.25 ? 'about twice as fast as' : ratio > 1.1 ? `${ratio.toFixed(1)} times as fast as` : 'about as fast as';
  const single = cu.market.facts.find(f => /single-vendor/i.test(f.metric));
  const forecast = cu.market.facts.find(f => /forecast/i.test(f.metric) && /USD/.test(f.unit));
  const kev = pub.kev.status === 'loaded' ? pub.kev.data : null;
  const series = Object.entries(cu.series).map(([name, points]) => ({ name, points, ...(SERIES_STYLE[name] || { color: PAL.slate, short: name }) }));

    const e = pub[k], label = { sec: 'SEC filings', kev: 'CISA exploited vulnerabilities', census: 'Census business counts' }[k];

  const actions = [];
  if (single && forecast) actions.push(`Dell'Oro expects single-vendor SASE to take ${single.value}% of a $${forecast.value}B market by 2029. That makes the SD-WAN bundle a strategy, not just a win-rate tactic: it is where the market is heading.`);

    : 'Once the CISA data is in, lead the renewal-timed play with the architectural argument: fewer internet-exposed appliances to patch.');

  root.innerHTML = `
  <header class="claim"><h1>${esc(panw && mkt ? `Palo Alto's SASE business is growing ${pace} the market, and the market is consolidating onto single-vendor platforms.` : 'Market context from public sources.')}</h1>

  <div class="grid g2">
    ${panel('mk-growth', 'Latest reported growth', 'Year over year, for the most recent period each company reported. The dashed line is SASE market growth.')}

      legend(series.map(s => ({ label: s.short, color: s.color }))))}
  </div>
  <div class="grid g2">
    ${panel('mk-market', 'SASE market growth by quarter', "Dell'Oro Group: year-over-year growth in manufacturer revenue. Quarters not covered by the press releases used here are omitted.")}
    <section class="panel"><h3>Market structure</h3><p class="cap">Dell'Oro Group forecasts and share figures</p>
      <dl class="dl">${cu.market.facts.map(f => `<div><dt>${esc(f.metric)} (${esc(f.period)})</dt><dd>${f.unit === 'percent' ? `${f.value}%` : `${precisionWord(f.precision)}$${f.value}B`}</dd></div>`).join('')}

    tip: `${g.company}\n${g.metric}, ${g.fiscal_period}\n${fmt.pct(g.growth, 0)} year over year`,
  })), { fmt: v => fmt.pct(v, 0), max: roundAxisMax(Math.max(...companies.map(g => g.growth), mkt ? mkt.growth : 0), 1.12), labelW: 250, ref: mkt ? mkt.growth : null, refLabel: mkt ? `Market ${fmt.pct(mkt.growth, 0)}` : '', aria: 'Latest reported growth by company' }));
  chart('mk-arr', el => Charts.timeLine(el, series, { fmt: v => `$${v.toFixed(1)}B`, endLabels: true, h: 270, aria: 'ARR by vendor over time' }));
  chart('mk-market', el => Charts.vbar(el, cu.market.quarterly.map(q => q.period), [{

  }], { fmt: v => fmt.pct(v, 0), max: roundAxisMax(Math.max(...cu.market.quarterly.map(q => q.growth)), 1.15), valueLabels: v => fmt.pct(v, 0), h: 230, aria: 'SASE market growth by quarter' }));
  if (kev) {
    const palette = [PAL.ultra, PAL.ink, PAL.ultraMid, PAL.slate, PAL.ultraSoft, PAL.slateSoft, '#E4E8EF'];

  }
  if (pub.census.status === 'loaded') {
    chart('mk-census', el => Charts.hbar(el, pub.census.data.segments.map(s => ({

  }
}

/* Routing, navigation, tooltips, and start-up. */
const ROUTES = [
  { id: 'briefing', name: 'Briefing', desc: 'The answer on one page', view: viewBriefing },
  { id: 'market', name: 'Market context', desc: 'Real public data: competitors and growth', view: viewMarket },
  { id: 'revenue', name: 'Revenue intelligence', desc: 'Pipeline, attach, whitespace, win and loss', view: viewRevenue },
  { id: 'planning', name: 'Planning simulator', desc: 'Capacity, hiring, and territories', view: viewPlanning },
  { id: 'launch', name: 'Prisma Browser launch', desc: 'ICP, targets, scorecard, field kit', view: viewLaunch },
  { id: 'exec', name: 'Executive layer', desc: 'Weekly business review and memo', view: viewExec },
  { id: 'cadence', name: 'Operating cadence', desc: 'Metrics, rhythm, RACI, data quality', view: viewCadence },
];
let currentRoute = null;

function renderShell() {
  $('#nav').innerHTML = `<ul>${ROUTES.map(r => `<li><a href="#${r.id}" data-id="${r.id}"><span class="n">${esc(r.name)}</span><span class="d">${esc(r.desc)}</span></a></li>`).join('')}</ul>`;
  const links = Object.entries(D.meta.links || {});
  $('#rail-foot').innerHTML = `<p>Built by ${esc(D.meta.author)}</p>` +
    (links.length ? `<p class="rail-links">${links.map(([k, v]) => `<a href="${esc(v)}" rel="noopener">${esc(k)}</a>`).join('')}</p>` : '') +
    '<p>Synthetic data. Not affiliated with or endorsed by Palo Alto Networks.</p>';
}

function route() {
  const [id, sub] = (decodeURIComponent(location.hash.slice(1)) || 'briefing').split('/');
  const r = ROUTES.find(x => x.id === id) || ROUTES[0];
  if (r.id === 'revenue' && sub && REV_TABS.some(t => t[0] === sub)) S.revTab = sub;
  $$('#nav a').forEach(a => (a.dataset.id === r.id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  const main = $('#main');
  main.innerHTML = `<div class="topbar"><span>Data as of ${esc(D.meta.asOfLabel)}, week ${D.meta.weekOfQuarter} of ${esc(D.meta.fiscalLabel)}</span>${r.id === 'market' ? '<span class="badge real">Real public data</span>' : '<span class="badge">Synthetic data</span>'}</div><div id="view"></div>`;
  CHARTS = [];
  r.view($('#view'));
  document.title = `${r.name} | SASE GTM Operating System`;
  if (currentRoute !== r.id) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  currentRoute = r.id;
}

(function init() {
  const tip = $('#tip');
  document.addEventListener('mousemove', e => {
    const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute('data-tip');
    tip.hidden = false;
    const pad = 14, r = tip.getBoundingClientRect();
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
    if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = `${Math.max(4, x)}px`;
    tip.style.top = `${Math.max(4, y)}px`;
  });
  document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
  window.addEventListener('resize', debounce(() => {
    CHARTS = CHARTS.filter(c => c.el.isConnected);
    CHARTS.forEach(c => c.draw(c.el));
  }, 120));
  window.addEventListener('hashchange', route);
  renderShell();
  route();
})();
